syntax = "proto3";

// HyperCore trading canon for Bitquery streaming. ALL market kinds flow here — perp, HIP-3, spot and
// outcome (prediction) — told apart by Market.Kind and the Market.IsPerp flag. Perp markets
// (perp + hip3) carry the full object set (Position/Leverage + Funding/Liquidation events); spot and
// outcome share the same execution core but leave the perp-only fields empty, until they get their own
// canons (spot pair, prediction sibling/probability). Filter clean perps with Market.IsPerp.

package hyperliquid_messages;


// ONE product message per HyperCore block — the single-stream canon (mirrors solana's
// PerpetualBlockMessage). Every kind of event a block produced rides in its own list, so a subscriber
// receives the whole block as one message and a downstream recorder projects each list into its own
// ClickHouse table. Lists are empty when the block had nothing of that kind — that is the shape, not a
// gap. The node delivers a block as several per-stream fragments (fills / order_statuses / book_diffs /
// oracle / misc / twap) on hyperliquidcore.blocks plus a separate consensus stream
// (hyperliquidcore.transactions); the processor reassembles them into this one message. LeverageChanges
// is sourced from the consensus stream, the other seven lists from the core block.
message HyperliquidCoreBlockMessage {
  uint64 BlockNumber = 1;
  int64  BlockTime   = 2; // epoch ns

  repeated Trade                Trades          = 3;  // executions (non-liquidation)
  repeated OrderUpdate          Orders          = 4;  // order lifecycle (incl. rejects, TP/SL legs)
  repeated PerpFunding          Funding         = 5;  // hourly funding per (trader, market)
  repeated PerpLiquidation      Liquidations    = 6;  // forced closes — their own product
  repeated Twap                 Twaps           = 7;  // TWAP lifecycle
  repeated BookUpdate           BookUpdates     = 8;  // per-order book changes (L4 microstructure)
  repeated PriceUpdate          Prices          = 9;  // oracle / mark republishes
  repeated TraderLeverageUpdate LeverageChanges = 10; // accepted updateLeverage (from the consensus stream)
  repeated SignedActionEvent    SignedActions   = 11; // consensus actions: rejects + rare types (from the consensus stream)
}


message Trader {
  string Address     = 1;
  string Signer      = 2; // signing agent (ecrecover)
  string Vault       = 3;
  string Broadcaster = 4;
  int64  SignedAt    = 5; // epoch ms
}

message Market {
  string Symbol      = 1;
  string Kind        = 2; // "perp" | "hip3" | "spot" | "outcome"
  string Protocol    = 3; // "hypercore" native, else HIP-3 dex
  string CoinRaw     = 4; // "HYPE", "xyz:NFLX", "@107", "#1890"
  bool   IsPerp      = 5; // true for perp+hip3 (full object set), false for spot/outcome — filter on this
  uint32 MaxLeverage = 6; // max leverage for the perp market (info-API meta); 0 = unknown / spot/outcome
}

// The trader's position AS OF this event — realtime fields come straight from the stream; the
// snapshot fields (Collateral/LiquidationPx/UnrealizedPnl) are intentionally absent here because
// HL only exposes them in a snapshot/API, not the realtime feed. Empty = source silent, NOT zero.
message PerpPosition {
  string Side        = 1; // "Long" | "Short"
  string Size        = 2; // signed (negative = short)
  string SizeBefore  = 3;
  string EntryPrice  = 4; // empty if opened pre-window
  string RealizedPnl = 5;
  string Funding     = 6; // signed
  uint32 Leverage    = 7; // 0 = not yet in map, NOT 1x
  bool   IsCross     = 8;
  bool   Closed      = 9;
}

// Money charged/credited on an execution. Reused by Trade and PerpLiquidation (only executions
// carry fees — an unfilled order does not). BuilderFee and DeployerFee are COMPONENTS of Fee (same
// unit = FeeToken); PriorityGas is NOT part of Fee and may be in a different unit.
message Fees {
  string Fee         = 1; // negative = maker rebate
  string FeeToken    = 2; // not always USDC
  string BuilderFee  = 3;
  string DeployerFee = 4; // HIP-3 asset deployer
  string PriorityGas = 5; // NOT a component of Fee
}

// The execution itself — the shared core of Trade and PerpLiquidation (both come from one Fill).
// A liquidation IS an Execution plus liquidation-specific details. Pair both sides of a match on
// (BlockNumber, Market, Tid).
message Execution {
  string Side        = 1; // "Buy" | "Sell"
  string Direction   = 2; // "Open Long", "Close Short", …
  bool   IsAggressor = 3; // taker
  string Price       = 4;
  string Size        = 5;
  uint64 Oid         = 6;
  string Cloid       = 7;
  uint64 Tid         = 8; // join both sides on (BlockNumber, Market, Tid)
  string Hash        = 9; // zero on TWAP — never a join key
  int64  EventTime   = 10; // per-fill event time, epoch ms (Fill.Time) — finer than block BlockTime
}

// Trade ← Fill (fills.proto), non-liquidation. One execution for one side; pair both sides on
// (BlockNumber, Market, Tid), never on Hash (zero on TWAP).
message Trade {
  Trader       Trader    = 1;
  Market   Market    = 2;
  Execution    Execution = 3; // Side/Direction/Price/Size/Oid/Cloid/Tid/Hash/IsAggressor
  Fees         Fees      = 4; // Fee/FeeToken/BuilderFee/DeployerFee/PriorityGas
  PerpPosition Position  = 5;

  string MarkPx  = 6; // empty if no oracle republish this block
  string Builder = 7; // builder address (usually empty)

  bool   IsTwap  = 8;
  uint64 TwapId  = 9; // 0 when not a TWAP
}

// PerpLiquidation ← Fill (fills.proto) with Liquidation set. A forced close IS an execution, so it
// shares the same Execution/Fees/Position objects as Trade, plus 4 liquidation-only fields. These
// fills are routed HERE only (excluded from Trade), so this row is the sole record — nothing lost.
message PerpLiquidation {
  Trader       Trader    = 1;
  Market   Market    = 2;
  Execution    Execution = 3; // the forced-close fill (Side/Price/Size/Oid/Tid/Hash/…)
  Fees         Fees      = 4;
  PerpPosition Position  = 5;

  // The 4 fields that make this a liquidation, not a plain trade — the product's exclusive value.
  string MarkPx         = 6; // mark price at liquidation — NOT the execution price (Execution.Price)
  string Method         = 7; // "market" | "backstop" — backstop = HLP absorbed it, market-stress signal
  string Liquidator     = 8; // backstop liquidator address, when the source names one
  string LiquidatedUser = 9; // FillLiquidation.LiquidatedUser (0x address being liquidated)
}


message OrderUpdate {
  Trader     Trader = 1;
  Market Market = 2;

  string Side       = 3; // "Buy" | "Sell"
  string Status     = 4; // "filled" | "open" | "canceled" | "badAloPxRejected" | …
  bool   IsReject   = 5;

  string OrderType  = 6; // "Limit" | "Market" | "Stop Market" | …
  string Tif        = 7; // "Alo" | "Ioc" | "Gtc" | …
  bool   ReduceOnly = 8;

  string LimitPx = 9;
  string Size    = 10; // remaining
  string OrigSz  = 11;

  string TriggerPx        = 12;
  string TriggerCondition = 13;
  bool   IsTrigger        = 14;
  bool   IsPositionTpsl   = 15;

  // TP/SL bracket: legs share Oid+Status; Leg tells them apart, ParentOid ties a leg to its parent.
  uint64 ParentOid = 16;
  uint32 Leg       = 17;

  PerpPosition Position = 18;

  uint64 Oid        = 19;
  string Cloid      = 20;
  string Hash       = 21; // empty if never on chain
  int64  PlacedTime = 22; // epoch ms

  string Builder    = 23; // order builder address (usually empty)
  uint32 BuilderFee = 24;
  int64  EventTime  = 25; // status-event time, epoch ns (OrderStatus.Time) — vs PlacedTime = placement
}


message Twap {
  Trader     Trader = 1;
  Market Market = 2;
  uint64 TwapId = 3;

  TwapOrder     Order    = 4;
  TwapInterval  Interval = 5;
  TwapExecution State    = 6;
}

message TwapOrder {
  string Side       = 1; // "Buy" | "Sell"
  string Size       = 2; // total requested, vs State.ExecutedSize
  bool   ReduceOnly = 3;
  bool   Randomize  = 4;
}

message TwapInterval {
  int64  StartTime       = 1; // TWAP start, epoch ms
  uint32 DurationMinutes = 2;
  int64  EventTime       = 3; // status-event time, epoch ns (TwapStatus.Time)
}

message TwapExecution {
  string Status           = 1; // "activated" | "finished" | "terminated" | "stopped" | "error"
  string StatusError      = 2; // set when Status = "error"
  string ExecutedSize     = 3; // cumulative filled
  string ExecutedNotional = 4; // cumulative, USD
}

// BookUpdate ← BookDiff (raw_book_diffs.proto). Per-order book change (L4) — market
// microstructure, distinct from an order's lifecycle in OrderUpdate.
message BookUpdate {
  Trader     Trader = 1;
  Market Market = 2;

  uint64 Oid  = 3;
  string Side = 4; // "Buy" | "Sell"
  string Px   = 5; // price level
  string Kind = 6; // "new" | "update" | "remove"

  string Size       = 7; // new size / size after
  string SizeBefore = 8; // update only

  PerpPosition Position = 9;
  uint32       Index    = 10; // ordinal within block
}

// PerpFunding ← misc_events Funding/FundingDelta. Hourly funding, per (trader, market).
message PerpFunding {
  Trader     Trader = 1;
  Market Market = 2;

  string Amount = 3; // signed (+ received, − paid)
  string Rate   = 4; // signed
  string Size   = 5; // signed
}

// TraderLeverageUpdate ← transactions SignedAction updateLeverage (accepted only). The leverage
// CHANGE itself; the resulting value is also on every Position.Leverage.
message TraderLeverageUpdate {
  Trader     Trader = 1;
  Market Market = 2;

  uint32 Leverage = 3;
  bool   IsCross  = 4;
}


// SignedActionEvent ← consensus replica_cmds (transactions.proto), one denormalized row per action:
// block/bundle context + ecrecover'd Signer + parsed Leverage. Carries what the event streams never do
// — rejects (Status="err") and the real Signer. Only rejects + rare action types ride this list;
// successful order/cancel appear in Orders/Trades with more structure.
message SignedActionEvent {
  SignedActionConsensus Consensus = 1;
  SignedActionBundle    Bundle    = 2;

  bytes  User         = 3;  // acting MASTER account (NOT the signer)
  bytes  Signer       = 4;  // ecrecover'd agent wallet; empty for system/unsigned actions
  bytes  VaultAddress = 5;  // set when acting for a vault
  string ActionType   = 6;  // "order" | "cancel" | "spotSend" | … open set. LowCardinality
  uint64 Nonce        = 7;  // epoch ms by convention
  int64  ExpiresAfter = 8;  // epoch ms deadline, 0 when absent
  string Status       = 9;  // "ok" | "err"

  SignedActionLeverage Leverage = 10; // set only for accepted updateLeverage

  bytes  Action   = 11; // raw JSON of the action, verbatim
  bytes  Response = 12; // raw JSON: statuses/oids for "ok", error text for "err"
}

message SignedActionConsensus {
  uint64 Round           = 1;
  uint64 ParentRound     = 2;
  bytes  Proposer        = 3; // 0x… validator that proposed the block
  uint32 HardforkVersion = 4;
}

message SignedActionBundle {
  bytes  Hash             = 1; // L1 bundle hash — DISJOINT from Fill.Hash/OrderStatus.Hash
  bytes  Broadcaster      = 2;
  uint64 BroadcasterNonce = 3;
  uint32 Index            = 4; // bundle ordinal within block
  uint32 ActionIndex      = 5; // action ordinal within bundle
}

message SignedActionLeverage {
  uint32 Asset   = 1; // asset id; 0 = BTC (valid)
  uint32 Value   = 2; // leverage multiplier
  bool   IsCross = 3; // true = cross, false = isolated
}


// PriceUpdate ← OracleUpdate (oracle_updates.proto), flattened: each input list and each
// oracle_pxs list becomes one row per (Market, Kind).
message PriceUpdate {
  Market Market      = 1;
  string     Price       = 2;
  string     Kind        = 3; // "mark" | "oracle" | "markInput" | "spotInput" | "extPerpInput" | "extPerp"
  string     UpdateClass = 4; // "Normal" | "Deployer" | "Fallback"
  string     DailyPx     = 5;
  int64      UpdateTime  = 6; // epoch ns
}
