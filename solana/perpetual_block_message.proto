syntax = "proto3";
package solana_messages;

import "solana/block_message.proto";
import "solana/token_block_message.proto";

// Solana perpetual-futures stream. First implementation: Phoenix Eternal —
// see streaming_processor_solana/_docs/phoenix.trade/Readme.md.
//
//   Eternal  EtrnLzgbS7nMMy5fbD42kXiUzGg8XQzJ972Xtk1cjWih  matching engine + risk engine + collateral
//   Hawkeye  RiSeVw3ZjNfsaXPRb4mgaqYaEEt41pNNJoDvVh7pgQj   oracle / price publisher
//   Ember    EMBERpYNE6ehWmXymZZS2skiFmCa9V5dp14e1iduM5qy  deposit / withdrawal bridge
//
// PROTOCOL-NEUTRAL BY DESIGN. Every number here is already scaled to human units — asset
// units for sizes, quote currency for prices and amounts. Lots and ticks are Phoenix's
// internal model; Drift, Jupiter Perps and Adrena each use a different one, so raw on-chain
// units are deliberately not published. For Phoenix the conversion is
//   size  = BaseLots  / 10^BaseLotDecimals
//   quote = QuoteLots / 10^QuoteLotDecimals
//   price = Ticks * TickSize * 10^(BaseLotDecimals - QuoteLotDecimals)
// with the scaling constants taken from each event batch's MarketEventHeader.
//
// WHERE THE DATA COMES FROM (Phoenix Eternal): the outer instruction carries only the
// request; every resulting state transition is emitted by a self-CPI into
//   Log(eventBatch: OffChainMarketEvent { batchIndex: u32, events: Vec<MarketEvent> })
// a Borsh enum of 67 variants. One instruction may emit several such batches.

message PerpetualBlockMessage {
  BlockHeader Header = 1;
  repeated ParsedPerpetualTransaction Transactions = 2;
}

message ParsedPerpetualTransaction {
  uint32 Index = 1; // transaction index in the block
  bytes Signature = 2;
  TransactionStatus Status = 3;
  TransactionHeader Header = 4;

  // Split by volume, not by kind: market/oracle state is republished on every price move
  // and dwarfs user activity, so it gets its own message and its own table.
  repeated PerpetualEvent Events = 5;      // trades, orders, positions, collateral
  repeated PerpetualPriceEvent Prices = 6; // market / oracle state
}

message PerpetualExchange {
  bytes Program = 1;  // EtrnLzgbS7nMMy5fbD42kXiUzGg8XQzJ972Xtk1cjWih
  string Name = 2;    // "phoenix_eternal"
  string Family = 3;  // "Phoenix"
  string Version = 4; // IDL metadata version, e.g. "0.2.0"

  bytes Oracle = 5;   // Hawkeye price publisher
  bytes Bridge = 6;   // Ember deposit/withdrawal program
}

// One perpetual market. TickSize/LotSize are the minimum steps in human units, which is what
// the protocol-specific lot arithmetic collapses to.
message PerpetualAsset {
  // Protocol asset id. SOL's id is literally 0, so proto3 drops Id from the wire for every SOL
  // event: an absent (or 0) Id means SOL, not "unknown". SOL is also the busiest market, so this
  // is the common case, not an edge one. Join on Symbol, which is always present, and never treat
  // Id == 0 as a missing-value sentinel.
  uint64 Id = 1;
  string Symbol = 2;   // "SOL", "BTC", "GOLD"
  double TickSize = 3; // minimum price step, in quote currency (SOL: 0.01, BTC: 1, GOLD: 0.1)
  double LotSize = 4;  // minimum size step, in asset units (SOL: 0.01, BTC: 0.0001, GOLD: 0.001)

  // The mint every price and amount on this market is denominated in. On Phoenix Eternal that is
  // PhUsd, the token the exchange itself names as canonical — not the USDC it is backed 1:1 by
  // and which funds enter and leave as.
  Currency QuoteCurrency = 5;
}

// User-facing activity. Type is one of:
//   "OrderRequested"   the order as accepted, before it hits the book
//   "OrderPlaced"      resting order added to the book
//   "OrderCancelled"   removed or reduced; see Order.CancelReason
//   "OrderRejected"    see Order.RejectReason
//   "Fill"             one maker fill; Counterparty is the other side
//   "TriggerPlaced" / "TriggerCancelled" / "TriggerExecuted"       conditional orders
//   "StopLossPlaced" / "StopLossCancelled" / "StopLossExecuted"    stop-loss orders
//   "PnL"              realized PnL / position change
//   "Liquidation"
//
// COLLATERAL FLOWS ARE OUT OF SCOPE. Deposits, withdrawals, internal transfers and funding
// settlement move exchange-wide collateral rather than a position in a market, and this stream
// reports positions, orders and trades. There is no message for them: field 18 held one and is
// reserved. Funding is not lost — the protocol repeats each funding payment on the PnL event of
// the same batch (Position.Funding), and the collateral backing a position on each fill
// (Position.Collateral).
// Every account field is empty when the chain named no account — never the all-zero address,
// which would read as the System program. An expiry crank, for one, cancels orders it does not
// own: those events carry no Signer and no Trader, and are joined to their OrderPlaced by
// Order.Id.
message PerpetualEvent {
  bytes Signer = 1;            // wallet that signed the transaction
  bytes Trader = 2;            // position-owning account (a PDA on Phoenix, not the wallet)
  bytes Counterparty = 3;      // other side of a fill (the maker when Trader is the taker)
  reserved 4;                  // was IsMaker — fills are always taker-perspective, the maker's move is its own PnL event
  bool CounterpartyIsAmm = 5;  // maker is protocol liquidity (a Phoenix spline), not a book order

  // Trader is protocol liquidity, not a user. A spline's position moves like anyone else's and
  // emits its own PnL events, so without this flag an aggregate over traders ranks the
  // protocol's own liquidity as its biggest trader. Filter it out of trader-facing queries.
  bool TraderIsAmm = 19;

  string Type = 6;
  string Side = 7;             // "bid" / "ask"

  uint32 EventIndex = 8;       // execution order inside the transaction
  uint32 InstructionIndex = 9; // top-level instruction that produced it
  uint64 Timestamp = 10;
  uint64 Slot = 11;

  PerpetualExchange Exchange = 12;
  PerpetualAsset Asset = 13;

  // Which of these is set depends on Type — the map, so a consumer needn't guess:
  //   OrderRequested/Placed/Cancelled/Rejected  Order, Amount, Price(.Limit)
  //   Trigger*/StopLoss*                        Order, Amount, Price(.Limit/.Trigger)
  //   Fill                                      Amount(.Filled/.Quote/.Fee), Price(.Execution), Position
  //   PnL                                       Position(incl. .Funding when funding settled)
  //   Liquidation                               Amount, Price, Position(.Liquidation/.Liquidator)
  // Price.Mark is denormalized from the market-state events of the same transaction, so it is
  // present whenever that transaction also republished a price for this asset — measured at 62%
  // of PnL events and 100% of fills. The protocol's PnL event carries no mark of its own, so for
  // the rest the mark has to come from the price stream, which is dense enough for an asof join
  // on (asset, slot): 12053 price rows to 2996 events in a nine-minute sample.
  //
  // These stay top-level messages rather than nested ones: protoc cannot resolve a nested type
  // whose name equals the field name.
  PerpetualOrder Order = 14;
  PerpetualAmount Amount = 15;
  PerpetualPrice Price = 16;
  PerpetualPosition Position = 17;
  reserved 18; // was PerpetualCollateral Collateral — collateral flows are out of scope, see above
}

message PerpetualOrder {
  // Order id in the venue's own order book — globally unique, and the key an order, its fills and
  // its cancellation are joined by. A conditional order (stop-loss / trigger) is NOT in the book
  // and has no id of its own until it fires; see ConditionalId. Where one appears on a conditional
  // order it is a book order *related* to it, and which one depends on the event: the order the
  // stop-loss created when it fired, or, for a trigger order, the resting order it is attached to.
  // Empty when the chain named none — never eight zero bytes.
  bytes Id = 1;
  bytes ClientId = 2;        // caller's own id; empty when none was sent
  string Type = 3;           // "limit", "market", "post-only", "stop-loss", "take-profit"
  uint64 ValidUntilSlot = 4; // 0 = good-till-cancel
  string CancelReason = 5;   // "UserRequested", "Expired", "SelfTradeCancelProvide", ...
  string RejectReason = 6;
  bool ReduceOnly = 7;

  // Identifies a conditional order (stop-loss, trigger) *within one trader and one market* — it is
  // NOT unique on its own, and it is not an order-book id. Join on (Trader, Asset.Id,
  // ConditionalId), which is how the venue itself addresses these orders: on Phoenix Eternal a
  // stop-loss lives in a fixed-size slot array keyed by (trader, asset), so its cancellation
  // identifies it by slot rather than by id and restates none of its parameters — side, size and
  // prices are recovered by joining back to the placement.
  //
  // Present on conditional orders only. `optional` on purpose: slot 0 is a real slot and the most
  // common one, so a plain uint64 would drop it from the wire and make "slot 0" indistinguishable
  // from "not a conditional order" — the same absent-reads-as-zero trap this schema fixed
  // elsewhere. Id stays empty on placement and cancellation for these, and carries the real book
  // id once the order fires and enters the book.
  optional uint64 ConditionalId = 8;
}

message PerpetualAmount {
  double Size = 1;      // signed, in asset units: 0.11 = long/bid, -0.11 = short/ask
  double Filled = 2;
  double Remaining = 3;
  double MinToFill = 4;
  double MinQuoteToFill = 5;

  double Quote = 6;     // quote currency spent (buy) or received (sell) on a fill
  double Fee = 7;       // taker fee; negative = maker rebate
}

message PerpetualPrice {
  double Limit = 1;     // requested / resting price
  double Execution = 2; // realized fill price
  double Trigger = 3;   // stop-loss / take-profit trigger price
  double Mark = 4;      // mark price of this transaction — denormalized so a PnL query needs no join
}

message PerpetualPosition {
  double Size = 1;       // position after the event, signed (negative = short)
  double SizeBefore = 2;
  double EntryPrice = 3; // average entry, folded from the protocol's virtual-quote balance
  double RealizedPnl = 4;
  double Funding = 5;    // funding paid (negative) or received (positive)
  double Collateral = 6; // collateral backing the position after the event

  bool Liquidation = 7;
  bytes Liquidator = 8;
  bool Closed = 9;
}

// Market / oracle state, republished on every price move. Type is one of:
//   "Prices"            best bid/ask, last trade, mark, spot and perp references
//   "MarketSummary"     open interest and accumulated fees
//   "FundingParameters" funding interval / cap changed
//   "MarketStatus"      market opened, paused, closed
//
// PUBLISHED AS A SIDE EFFECT OF TRADING ONLY. The oracle (Hawkeye) republishes every market's
// price on a timer — 97.5% of the program's instructions, and 12939 of 13434 price rows in a live
// sample, every one of them in a transaction with no user activity. That feed is not published:
// a trade already carries a fresh mark, and the oracle only adds a *continuous* mark for an idle
// position. So a market that does not trade produces no rows here at all, and SequenceNumber is
// per-asset but sparse.
//
// A market whose lot scaling is not known yet is likewise skipped rather than published with
// zeros. A gap is recoverable; a fabricated Mark of 0 is not.
message PerpetualPriceEvent {
  string Type = 1;
  uint32 EventIndex = 2;
  uint32 InstructionIndex = 3;
  uint64 Timestamp = 4;
  uint64 Slot = 5;
  uint64 SequenceNumber = 6; // per-asset sequence number — ordering and dedup key

  PerpetualExchange Exchange = 7;
  PerpetualAsset Asset = 8;
  reserved 9;                // was Publisher, the oracle signer — the oracle feed is not published

  double BestBid = 10;
  double BestAsk = 11;
  double LastTrade = 12;
  double Mark = 13;
  double Spot = 14; // exchange spot reference
  double Perp = 15; // exchange perp reference

  double FundingRate = 16;     // cumulative funding rate
  double FundingInterval = 17; // seconds
  double MaxFundingRate = 18;

  double OpenInterest = 19;
  double MakerFees = 20;
  double TakerFees = 21;

  string Status = 22;
}
