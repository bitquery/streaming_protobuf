syntax = "proto3";
package solana_messages;

import "solana/block_message.proto";
import "solana/token_block_message.proto";
import "solana/parsed_idl_block_message.proto";

message DexInfo {
  bytes  ProgramAddress = 1;
  string ProtocolName = 2;
  string ProtocolFamily = 3;
}

message DexMarket {
  bytes MarketAddress = 1;
  Currency BaseCurrency = 2;
  Currency QuoteCurrency = 3;
}

message DexOrder {
  bytes OrderId = 1;
  bool  BuySide = 2;

  uint64 LimitPrice = 3;
  uint64 LimitAmount = 4;

  bytes Account = 5;
  bytes Owner = 6;
  bytes Payer = 7;
  bytes Mint = 8;

  float LimitPriceInUSD = 9;
  float LimitAmountInUSD = 10;
}

message ParsedPoolLiquidityChange {
  uint32 Index = 1;
  bytes Signature = 2;
  TransactionStatus Status = 3;
  TransactionHeader Header = 4;

  repeated PoolLiquidityChangeEvent Changes = 5;
}

// PoolPrice is the pool's marginal price right after the event, read from the venue's own
// swap event: what the curve quotes for the next infinitesimal trade, not the executed
// amountOut / amountIn of the swap that produced the row. Absent (nil) when the event
// carries no price state: a deposit or withdrawal on a venue whose liquidity events report
// none, or a venue not yet covered.
message PoolPrice {
  // Price is quote per base in UI units, oriented as Market.BaseCurrency /
  // Market.QuoteCurrency of the same event, decimals applied.
  float Price = 1;
  // PriceInUSD is Price times the quote currency's USD rate from the processor's own
  // price enricher, the same rate PostAmountInUSD uses; 0 when the quote has no rate.
  float PriceInUSD = 2;
  // Source names what the price was read from, so a consumer can weigh it:
  // "event" (the venue's swap event reports the post-swap state),
  // "reserves" (quote reserve over base reserve on a constant-product venue).
  string Source = 3;
}

message PoolLiquidityChangeEvent {
  uint32 InstructionIndex = 1;
  DexInfo Dex = 2;
  DexMarket Market = 3;
  PoolSide BaseCurrency = 4;
  PoolSide QuoteCurrency = 5;
  ParsedIdlInstruction Instruction = 6;
  PoolPrice Price = 7;
}

message PoolSide {
  int64    ChangeAmount = 2;
  uint64   PostAmount = 3;

  float ChangeAmountInUSD = 4;
  float PostAmountInUSD = 5;
}

enum DexOrderEventType {
  OPEN = 0;
  UPDATE = 1;
  CANCEL = 2;
}

message DexOrderEvent {
  uint32 InstructionIndex = 1;
  DexOrderEventType Type = 2;
  DexInfo Dex = 3;
  DexMarket Market = 4;
  DexOrder Order = 5;
  ParsedIdlInstruction Instruction = 6;
}


message DexTradeSide {
  uint64     Amount = 1;
  Currency Currency = 2;

  Account Account = 3;
  DexOrder Order = 4;

  float AmountInUSD = 5;
}

message DexTradeEvent {
  uint32 InstructionIndex = 1;
  DexInfo Dex = 2;
  DexMarket Market = 3;
  DexTradeSide Buy = 4;
  DexTradeSide Sell = 5;
  uint64 Royalty = 6;
  uint64 Fee = 7;
  ParsedIdlInstruction Instruction = 8;
}

message ParsedDexTransaction {
  uint32 Index = 1;
  bytes Signature = 2;
  TransactionStatus Status = 3;
  TransactionHeader Header = 4;

  repeated DexTradeEvent Trades = 5;
  repeated DexOrderEvent OrderEvents = 6;
  repeated PoolLiquidityChangeEvent PoolEvents = 7;

  repeated BalanceUpdate TotalBalanceUpdates = 8;      // native SOL (lamports)
  repeated BalanceUpdate TotalTokenBalanceUpdates = 9; // SPL/Token-2022 raw amounts

  float FeeInUSD = 10;
}

message DexParsedBlockMessage {
  BlockHeader Header = 1;
  repeated ParsedDexTransaction Transactions = 2;
}
