syntax = "proto3";
package marketdata_messages;

import "market/marketdata.proto";
import "market/pool.proto";

message Currency {
  string Id = 1;
  string Name = 2;
  string Symbol = 3;
}

message Market {
  string Id = 1;
  string Network = 2; // LowCardinality string in clickhouse
  string NetworkBid = 3;
  string Name = 4;
  string Address = 5;
  string Protocol = 6; // LowCardinality string in clickhouse
  string ProtocolFamily = 7; // LowCardinality string in clickhouse
  string Program = 8;
}

message Amounts {
  float Base = 1;
  float Quote = 2;
  float Usd = 3;
  float BaseAttributedToUsd = 4;
}

message Quote {
  Currency QuoteCurrency = 1;
  Amounts Amounts = 2;
}


message TimeInterval {
  uint32 Duration = 1;
  uint32 Start = 2;
  uint32 End = 3;
}

message Ohlc {
  float Open = 1;
  float Close = 2;
  float High = 3;
  float Low = 4;
  float Volume = 5;
}

message PriceByTimeInterval {
  TimeInterval TimeInterval = 1;

  Amounts Amounts = 2;

  float MeanPrice = 3;

  float SimpleMovingAverage = 4;
  float WeightedSimpleMovingAverage = 5;
  float ExponentialMovingAverage = 6;

  Ohlc Ohlc = 7;

}

message PriceByVolume {
  float TargetVolume = 1;

  TimeInterval TimeInterval = 2;

  Amounts Amounts = 3;

  float MeanPrice = 4;
}

message EstimatedPrices {
  float AdaptivePrice = 1;
}

message PriceUpdate {
  repeated Quote Quotes = 1;
  repeated PriceByTimeInterval PriceByTimeIntervals = 2;
  repeated PriceByVolume PriceByVolumes = 3;
  EstimatedPrices Estimates = 4;
}

message MarketCapUpdate {
  double TotalSupply = 1;
  double MarketCap = 2;
  double FullyDilutedValuationUsd = 3; // Fully diluted valuation (FDV) is a market cap if the max supply was in circulation

  optional double CirculatingSupply = 4;
  optional double MaxSupply = 5;
}

// Liquidity is a pool's reserves and the USD depth derived from them, carried on the price
// index updates for the liquidity-weighted price index. At the pair level it is one pool's
// reserves; at the token/currency level Usd is the sum over the asset's pools.
message Liquidity {
  // Usd is the pool's USD liquidity - the quote-leg reserve valued in USD, the depth that
  // backs the price. Summed over pools at token/currency level.
  float Usd = 1;
  // BaseReserve and QuoteReserve are the post-event reserves as UI amounts; set at the pair
  // level only.
  float BaseReserve = 2;
  float QuoteReserve = 3;
  // QuoteReserveUsd is QuoteReserve valued in USD (equals Usd for a single pool).
  float QuoteReserveUsd = 4;
  // UpdatedAt is the unix second of the reserve snapshot, for freshness.
  uint32 UpdatedAt = 5;
  // Source names where Usd came from, so a real reserve can be told from an estimate:
  // "real" (a reserve snapshot), "real_stale" (a snapshot past the freshness window,
  // still the best known), "retired" (a launch curve its token has left: 0),
  // "migration" (a curve's cumulative net quote, or the amount that migrated to its
  // venue), "impact" (depth from net flow against the price move), "volume"
  // (turnover-scaled trade volume), "none". At the token/currency level it is the
  // source of the leading (Position 1) part.
  string Source = 6;
  // RealShare is the fraction of Usd backed by a reserve snapshot: 1 or 0 for one pool,
  // in between for a token or currency summed over pools.
  float RealShare = 7;
  // DepthUsd is the quote-side amount, in USD, that can be sold into the pool inside the
  // reserve event's slippage tier (1 %): what of the reserve is actually tradable at the
  // spot. The index caps Usd at DepthUsd x liquidity_depth_scale. 0 when the snapshot
  // carried no slippage table. Pair level only.
  float DepthUsd = 8;
  // NetQuoteUsd is a launch curve's lifetime net quote in USD - quote paid in minus quote
  // paid out - which for a bonding curve is its reserve and its progress to graduation.
  // On a retired curve it is the amount that migrated to the venue. 0 for a pool that is
  // not a configured launcher. Pair level only.
  float NetQuoteUsd = 9;
}

// PoolPriceUpdate is a pool's own price: what its curve quotes at its current liquidity,
// read from the pool event beside the reserves (the EVM slippage table's spot, a Solana
// venue's post-swap state or the reserves of a constant-product pool). It is the marginal
// price after the last swap the pool saw, not the price any trade executed at, and it is
// not blended: a consumer wanting the pool's curve reads this, one wanting what traded
// reads PriceUpdate. Pair level only, in two units like the traded price: every value in
// PairUpdate.PoolPriceUpdate is in USD through the quote currency's rate the pair's trades
// are priced with, every value in PairUpdate.PoolPriceUpdateInQuoteTokens is in quote
// tokens per base token, oriented as the PairUpdate. Absent when the pool holds no priced
// snapshot; the USD one is also absent when the quote currency has no USD rate.
message PoolPriceUpdate {
  // Price is the latest spot, the close of the shortest interval below.
  float Price = 1;
  // Source names where the price was read from: "table" (the spot of an EVM
  // PoolPriceTable), "event" (a Solana venue's swap event reports the post-swap state),
  // "reserves" (quote reserve over base reserve on a constant-product pool).
  string Source = 2;
  // UpdatedAt is the unix second of the pool event the price was read from, so a price
  // older than the row's trades can be told apart.
  uint32 UpdatedAt = 3;
  // PriceByTimeIntervals is the spot over each configured interval, one entry per
  // interval of PriceUpdate.PriceByTimeIntervals on the same PairUpdate, matched by
  // TimeInterval. Ohlc is the spot's: Open the previous interval's close, High and Low the
  // extremes the curve quoted after a swap inside the interval, so on a thin pool they sit
  // beyond the traded Ohlc by each swap's own impact. The moving averages are over the
  // same series. Amounts, MeanPrice and Ohlc.Volume are not set: a spot has no volume.
  repeated PriceByTimeInterval PriceByTimeIntervals = 4;
}

message CurrencyUpdate {
  Currency Currency = 1;
  PriceUpdate PriceUpdate = 2;
  optional MarketCapUpdate MarketCapUpdate = 3;
  Liquidity Liquidity = 4;
}

message TokenUpdate {
  Currency Currency = 1;
  Token Token = 2;
  PriceUpdate PriceUpdate = 3;
  optional MarketCapUpdate MarketCapUpdate = 4;
  Ranking Ranking = 5;
  Liquidity Liquidity = 6;
  RankingDetail RankingDetail = 7;
  LeadingPool LeadingPool = 8;
}

message Ranking {
  uint32 Position = 1;
  float  Weight = 2;
}

// RankingDetail explains a part's Ranking: what the blend did with its price and how much
// of its weight the staleness rule left it. Carried on PairUpdate (a pool among its token's
// pools) and TokenUpdate (a token among its currency's tokens); deliberately not on trades.
message RankingDetail {
  // Verdict is what happened to the part's price in this batch's blend:
  // "priced" (accepted into the blend), "clamped" (accepted, bounded to the blend cap),
  // "outlier" (rejected by the outlier band), "ineligible" (refused by the eligibility
  // gate: too little money or history), "no_price" (no price in the window; ranked by
  // weight 0), "retired" (a launch curve its token has left).
  string Verdict = 1;
  // StaleMultiplier is the staleness discount applied to the weight, in (0, 1]: 1 for a
  // part trading at its own rhythm, halving every stale half-life past its threshold.
  // Ranking.Weight is the part's share of the discounted weights.
  float StaleMultiplier = 2;
}

// LeadingPool names the pool at Ranking Position 1 among a token's pools - the one whose
// Liquidity.Source the TokenUpdate reports - so a consumer of token updates can tell which
// pool is pricing the token without joining to the pair updates of the same batch.
message LeadingPool {
  // MarketId is Market.Id of the leading pool's PairUpdate.
  string MarketId = 1;
  // QuoteTokenId is QuoteToken.Id of that PairUpdate.
  string QuoteTokenId = 2;
  // PoolAddress is Pool.Address of that PairUpdate; empty where the market has no pool address.
  string PoolAddress = 3;
}

message PairUpdate {
  Currency Currency = 1;
  Currency QuoteCurrency = 2;
  Token Token = 3;
  Token QuoteToken = 4;
  Market Market = 5;
  PriceUpdate PriceUpdate = 6;
  PriceUpdate PriceUpdateInQuoteTokens = 7;
  optional MarketCapUpdate MarketCapUpdate = 8;
  Ranking Ranking = 9;
  Pool Pool = 10;
  Liquidity Liquidity = 11;
  RankingDetail RankingDetail = 12;
  PoolPriceUpdate PoolPriceUpdate = 13;
  PoolPriceUpdate PoolPriceUpdateInQuoteTokens = 14;
}

message PriceIndexMessage {
  uint64 Time = 1;
  repeated CurrencyUpdate CurrencyUpdates = 2;
  repeated TokenUpdate TokenUpdates = 3;
  repeated PairUpdate PairUpdates = 4;
}
